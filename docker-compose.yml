name: agentforge

# Bounded container logs: Docker's json-file default never rotates and fills small VMs.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-app: &app
  image: agentforge-app:local
  build: .
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 384m
  cpus: 1
  logging: *logging

# Each process receives only the secrets it uses. The public API holds the operator key
# but no provider or sandbox credentials; the worker holds those but not the operator key.
x-db-env: &db-env
  AGENTFORGE_ENVIRONMENT: ${AGENTFORGE_ENVIRONMENT:-development}
  AGENTFORGE_DATABASE_URL: postgresql+asyncpg://agentforge:${POSTGRES_PASSWORD:?Generate .env}@postgres:5432/agentforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_DB: agentforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentforge -d agentforge"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 128

  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --appendonly, "no"]
    networks: [cache]
    restart: unless-stopped
    logging: *logging
    read_only: true
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    pids_limit: 32

  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    environment:
      <<: *db-env
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  tool-image:
    image: agentforge-tool:local
    build: ./sandbox
    command: [python, -c, "print('Tool image ready')"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 16
    restart: "no"
    logging: *logging

  sandbox:
    <<: *app
    command: [uvicorn, "agentforge.sandbox:create_app", --factory, --host, "0.0.0.0", --port, "8001", --no-access-log]
    environment:
      AGENTFORGE_SANDBOX_KEY: ${AGENTFORGE_SANDBOX_KEY:?Run python scripts/bootstrap.py first}
      AGENTFORGE_TOOL_IMAGE: agentforge-tool:local
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    group_add: ["${DOCKER_GID:-0}"]
    networks: [tools]
    depends_on:
      tool-image: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 15

  api:
    <<: *app
    environment:
      <<: *db-env
      AGENTFORGE_API_KEY: ${AGENTFORGE_API_KEY:?Run python scripts/bootstrap.py first}
      AGENTFORGE_REDIS_URL: redis://redis:6379/0
      AGENTFORGE_CORS_ORIGINS: ${AGENTFORGE_CORS_ORIGINS:-["http://localhost:8080"]}
      # nginx appends the browser address to X-Forwarded-For; production adds Caddy (2).
      AGENTFORGE_TRUSTED_PROXY_HOPS: "1"
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [web, data, cache]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15

  worker:
    <<: *app
    command: [python, -m, agentforge.worker]
    environment:
      <<: *db-env
      AGENTFORGE_SANDBOX_KEY: ${AGENTFORGE_SANDBOX_KEY:?Run python scripts/bootstrap.py first}
      AGENTFORGE_SANDBOX_URL: http://sandbox:8001
      AGENTFORGE_OPENAI_KEY: ${AGENTFORGE_OPENAI_KEY:-}
      AGENTFORGE_OPENAI_MODEL: ${AGENTFORGE_OPENAI_MODEL:-gpt-4.1-mini}
      AGENTFORGE_GEMINI_KEY: ${AGENTFORGE_GEMINI_KEY:-}
      AGENTFORGE_GEMINI_MODEL: ${AGENTFORGE_GEMINI_MODEL:-gemini-3.8-flash}
      AGENTFORGE_OPENAI_INPUT_RATE: ${AGENTFORGE_OPENAI_INPUT_RATE:-1.0}
      AGENTFORGE_OPENAI_OUTPUT_RATE: ${AGENTFORGE_OPENAI_OUTPUT_RATE:-5.0}
      AGENTFORGE_GEMINI_INPUT_RATE: ${AGENTFORGE_GEMINI_INPUT_RATE:-1.5}
      AGENTFORGE_GEMINI_OUTPUT_RATE: ${AGENTFORGE_GEMINI_OUTPUT_RATE:-8.0}
      AGENTFORGE_DAILY_BUDGET_USD: ${AGENTFORGE_DAILY_BUDGET_USD:-2.0}
    # egress: provider HTTPS only. The worker is the only service that calls LLM APIs.
    networks: [data, tools, egress]
    stop_grace_period: 20s
    depends_on:
      api: {condition: service_healthy}
      sandbox: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, agentforge.worker, --check]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: agentforge-frontend:local
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    networks: [web]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:

# Segmented so a compromised edge or frontend cannot reach PostgreSQL, Redis, or the
# Docker-socket gateway. `internal` networks have no route outside the host.
networks:
  web: {}                    # frontend <-> api (also carries the development port mappings)
  data: {internal: true}     # api, worker, migrate <-> postgres
  cache: {internal: true}    # api <-> redis
  tools: {internal: true}    # worker <-> sandbox gateway
  egress: {}                 # worker -> model providers
