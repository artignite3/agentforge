[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-runtime"
version = "0.1.0"
description = "Durable, observable execution for bounded repository agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.39,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1", "redis>=5.2,<7", "alembic>=1.15,<2",
  "docker>=7.1,<8", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "bandit>=1.8,<2", "pip-audit>=2.8,<3", "types-docker>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: requires a running Docker engine and tool image", "postgres: requires PostgreSQL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/agentforge"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
